name: Publish Extensions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to VS Code Marketplace & Open VSX
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test & lint
        run: |
          pnpm build
          pnpm test
          pnpm lint

      - name: Package VSIX files
        run: pnpm package

      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: |
          pnpm dlx @vscode/vsce publish --packagePath packages/vscode/vscode-theme-zellner-0.1.1.vsix -p "$VSCE_PAT"
          pnpm dlx @vscode/vsce publish --packagePath packages/vscode-extended/vscode-theme-zellner-extended-0.1.1.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: |
          pnpm dlx ovsx create-namespace YueYu -p "$OVSX_PAT" || true
          pnpm dlx ovsx publish packages/vscode/vscode-theme-zellner-0.1.1.vsix -p "$OVSX_PAT"
          pnpm dlx ovsx publish packages/vscode-extended/vscode-theme-zellner-extended-0.1.1.vsix -p "$OVSX_PAT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/vscode/*.vsix
            packages/vscode-extended/*.vsix
